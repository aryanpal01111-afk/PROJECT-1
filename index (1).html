<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Image Gallery</title>
<style>
:root{--bg:#14171c;--ink:#eef1f4;--mute:#9aa4b0;--accent:#f2b84b}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--ink);font-family:Georgia,'Times New Roman',serif;padding:2rem 1rem}
header{max-width:1100px;margin:0 auto 1.5rem}
h1{font-size:clamp(1.8rem,5vw,3rem);font-weight:400}
.filters{display:flex;flex-wrap:wrap;gap:.5rem;margin-top:1rem}
.filters button{font:inherit;background:none;color:var(--mute);border:1px solid #333b45;padding:.4rem 1rem;border-radius:99px;cursor:pointer;transition:.25s}
.filters button:hover,.filters button.on{color:#14171c;background:var(--accent);border-color:var(--accent)}
.grid{max-width:1100px;margin:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:1rem}
.item{position:relative;overflow:hidden;border-radius:6px;cursor:pointer;aspect-ratio:4/3;border:0;padding:0;background:none}
.item img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .5s}
.item:hover img,.item:focus-visible img{transform:scale(1.08)}
.item span{position:absolute;inset:auto 0 0;padding:1.5rem .8rem .6rem;background:linear-gradient(transparent,#000a);text-align:left;color:#fff;opacity:0;transform:translateY(8px);transition:.3s}
.item:hover span,.item:focus-visible span{opacity:1;transform:none}
.item.hide{display:none}
#lb{position:fixed;inset:0;background:#000d;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .3s;z-index:9}
#lb.open{opacity:1;pointer-events:auto}
#lb img{max-width:86vw;max-height:78vh;border-radius:6px;transition:opacity .25s}
#cap{position:absolute;bottom:1.5rem;width:100%;text-align:center;color:var(--mute)}
#lb button{position:absolute;background:#ffffff1a;color:#fff;border:0;font-size:1.8rem;width:3rem;height:3rem;border-radius:50%;cursor:pointer;transition:.2s}
#lb button:hover{background:var(--accent);color:#14171c}
#prev{left:1rem}#next{right:1rem}#close{top:1rem;right:1rem}
@media(max-width:560px){#prev,#next{top:auto;bottom:3.5rem}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header>
  <h1>Image Gallery</h1>
  <div class="filters" id="filters"></div>
</header>
<main class="grid" id="grid"></main>

<div id="lb" role="dialog" aria-modal="true" aria-label="Image viewer">
  <button id="close" aria-label="Close">&times;</button>
  <button id="prev" aria-label="Previous">&#8249;</button>
  <img id="big" alt="">
  <button id="next" aria-label="Next">&#8250;</button>
  <div id="cap"></div>
</div>

<script>
// Images are generated as SVG so the gallery works offline. Swap `src` for real photo URLs if you like.
const palettes={
  Nature:[['#2d6a4f','#95d5b2'],['#1b4332','#74c69d'],['#40916c','#d8f3dc']],
  Ocean:[['#023e8a','#90e0ef'],['#0077b6','#caf0f8'],['#03045e','#48cae4']],
  Sunset:[['#e76f51','#f4a261'],['#9d0208','#faa307'],['#6a040f','#e85d04']]
};
const names={Nature:['Fern valley','Pine ridge','Meadow'],Ocean:['Calm bay','Deep blue','Shoreline'],Sunset:['Ember sky','Dusk','Golden hour']};
const svg=(a,b,n)=>'data:image/svg+xml,'+encodeURIComponent(
 `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${a}"/><stop offset="1" stop-color="${b}"/></linearGradient></defs><rect width="800" height="600" fill="url(#g)"/><circle cx="${200+n*150}" cy="${180+n*40}" r="${90+n*20}" fill="#fff" opacity=".18"/><path d="M0 600V430Q200 ${330+n*30} 400 430T800 ${400-n*20}V600Z" fill="#000" opacity=".25"/></svg>`);
const items=[];
Object.keys(palettes).forEach(cat=>palettes[cat].forEach((p,i)=>items.push({cat,title:names[cat][i],src:svg(p[0],p[1],i)})));

const grid=document.getElementById('grid'),filters=document.getElementById('filters');
items.forEach((it,i)=>{
  const b=document.createElement('button');b.className='item';b.dataset.cat=it.cat;
  b.innerHTML=`<img src="${it.src}" alt="${it.title}" loading="lazy"><span>${it.title}</span>`;
  b.onclick=()=>open(b);grid.appendChild(b);
});
['All',...Object.keys(palettes)].forEach((c,i)=>{
  const b=document.createElement('button');b.textContent=c;if(!i)b.className='on';
  b.onclick=()=>{filters.querySelectorAll('button').forEach(x=>x.classList.remove('on'));b.classList.add('on');
    grid.querySelectorAll('.item').forEach(el=>el.classList.toggle('hide',c!=='All'&&el.dataset.cat!==c));};
  filters.appendChild(b);
});

const lb=document.getElementById('lb'),big=document.getElementById('big'),cap=document.getElementById('cap');
let list=[],idx=0;
function show(){const el=list[idx],im=el.querySelector('img');big.style.opacity=0;
  setTimeout(()=>{big.src=im.src;big.alt=im.alt;cap.textContent=`${im.alt} (${idx+1}/${list.length})`;big.style.opacity=1},150);}
function open(el){list=[...grid.querySelectorAll('.item:not(.hide)')];idx=list.indexOf(el);lb.classList.add('open');show();}
const step=d=>{idx=(idx+d+list.length)%list.length;show()},close=()=>lb.classList.remove('open');
prev.onclick=()=>step(-1);next.onclick=()=>step(1);document.getElementById('close').onclick=close;
lb.onclick=e=>{if(e.target===lb)close()};
document.addEventListener('keydown',e=>{if(!lb.classList.contains('open'))return;
  if(e.key==='ArrowLeft')step(-1);if(e.key==='ArrowRight')step(1);if(e.key==='Escape')close();});
</script>
</body>
</html>
